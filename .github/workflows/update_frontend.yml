name: update_frontend

# Nightly, independent frontend pipeline:
#   app mirror -> app prepare -> build core
# Refreshes core/app/z2ui5/webapp from the abap2UI5 static UI5 webapp.
# Runs on its own schedule, independent of update_samples / update_backend.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC nightly
  workflow_dispatch:
  workflow_call: # chained by trigger_update

permissions:
  contents: write

concurrency:
  group: update_frontend
  cancel-in-progress: false

jobs:
  mirror:
    uses: ./.github/workflows/app_mirror.yml
  prepare:
    needs: mirror
    uses: ./.github/workflows/app_prepare.yml
  build_core:
    needs: prepare
    uses: ./.github/workflows/build_core.yml
  trigger_cap:
    # idempotent: pushes only when core/ actually changed since the last trigger
    needs: build_core
    uses: ./.github/workflows/trigger_cap.yml
    secrets: inherit

  report_failure:
    # A silently failing nightly stalls the whole downstream chain (CAP app
    # publish + web build). Open (or bump) an issue so somebody sees it.
    needs: [mirror, prepare, build_core, trigger_cap]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - uses: abap2UI5/abap2UI5/.github/actions/report-scheduled-failure@main
