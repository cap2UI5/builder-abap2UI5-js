name: samples mirror

# Mirror the abap2UI5/samples cloud branch (whole branch, 1:1) into run/input/samples/.
# Step 1 of the update_samples pipeline; also runnable standalone.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm run mirror_samples
      - name: commit
        uses: ./.github/actions/commit-generated
        with:
          paths: run/input/samples
          message: "mirror: update run/input/samples ($(cut -c1-12 run/input/samples/UPSTREAM_COMMIT))"
