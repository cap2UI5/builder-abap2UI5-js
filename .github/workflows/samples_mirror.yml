name: samples mirror

# Mirror the abap2UI5/samples cloud branch (whole branch, 1:1) into run/input/samples/.
# Step 1 of the update_samples pipeline; also runnable standalone.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run mirror_samples
      # A `with:` input is never run through a shell — a $(…) in the commit
      # message would land in the history verbatim. Resolve it here instead.
      - name: read upstream sha
        id: upstream
        run: echo "short=$(cut -c1-12 run/input/samples/UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: commit
        uses: ./.github/actions/commit-generated
        with:
          paths: run/input/samples
          message: "mirror: update run/input/samples (${{ steps.upstream.outputs.short }})"
