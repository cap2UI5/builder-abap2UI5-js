name: oracle

# Differential oracle over the known-failures baseline.
#
# The upstream abap2UI5 repo ships its own JS runtime under node/ — the
# official @abaplint transpiler plus open-abap-core, executing the REAL
# (downported) ABAP, including every testclass this repo transpiles. Whatever
# runs green THERE is proven achievable in JavaScript, so a baseline entry
# that the oracle passes is a fixable bug HERE rather than ABAP-kernel magic.
#
# That is the only tool in this repo that answers "how much of the baseline is
# actually work?", and until now it ran only by hand — which means never, and
# it goes stale with every upstream sync. Weekly, and on demand.
#
# It reports; it does not gate. The classification is input to a maintainer's
# judgement, not a pass/fail: a newly-provable entry is a lead to follow, not
# a build to break.
#
# Since 2026-08 it also COMMITS the classification to
# test/oracle-classification.json. It used to write only to the job summary,
# which expires with the Actions log — so the one tool that can answer "how
# much of the baseline is actually work?" produced an answer nobody could read
# a week later, and could not be diffed against the previous week. As a tracked
# file, an entry moving from NOTRUN to BUG shows up as a diff somebody can act
# on. The file is deterministic (sorted, no timestamps), so an unchanged
# verdict produces no commit.

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays, after the weekend's nightlies
  workflow_dispatch:

permissions:
  contents: write   # commits the refreshed classification

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check out upstream abap2UI5 (the oracle runtime)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/abap2UI5
          path: .oracle-upstream

      - run: npm ci

      # Downport → transpile → run, in the upstream checkout. This mutates
      # its src/ (that repo's own rule), which is fine here: the checkout is
      # throwaway and nothing is pushed back.
      - name: Run the upstream unit suite
        working-directory: .oracle-upstream
        run: |
          set -euo pipefail
          npm ci
          npm run auto_downport
          npm run auto_transpile
          # The suite is expected to have failures — that IS the signal.
          npm run unit > "$RUNNER_TEMP/oracle-run.txt" 2>&1 || true
          wc -l "$RUNNER_TEMP/oracle-run.txt"

      - name: Classify the baseline against it
        run: |
          set -euo pipefail
          {
            echo '### Oracle classification'
            echo
            echo '```'
            node scripts/oracle-classify.js "$RUNNER_TEMP/oracle-run.txt" .oracle-upstream \
              --json test/oracle-classification.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The throwaway upstream checkout must not end up in the commit.
      - name: Commit the classification when it changed
        run: |
          set -euo pipefail
          rm -rf .oracle-upstream
          if git diff --quiet -- test/oracle-classification.json; then
            echo "classification unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/oracle-classification.json
          git commit -m "oracle: refresh the baseline classification"
          # The nightlies push to the same branch; rebase rather than fail.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "could not push the refreshed classification" >&2
          exit 1
