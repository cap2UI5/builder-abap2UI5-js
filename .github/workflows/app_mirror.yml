name: app mirror

# Mirror the abap2UI5 static UI5 webapp (app/webapp) into
# run/input/app/webapp. Step 1 of the update_frontend pipeline;
# also runnable standalone.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run mirror_app
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add run/input/app/webapp run/input/app/UPSTREAM_COMMIT
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "mirror: update run/input/app/webapp ($(cut -c1-12 run/input/app/UPSTREAM_COMMIT))"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
