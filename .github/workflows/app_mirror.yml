name: app mirror

# Mirror the abap2UI5 static UI5 webapp (app/webapp) into
# run/input/app/webapp. Step 1 of the update_frontend pipeline;
# also runnable standalone.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm run mirror_app
      - name: commit
        uses: ./.github/actions/commit-generated
        with:
          paths: run/input/app/webapp run/input/app/UPSTREAM_COMMIT
          message: "mirror: update run/input/app/webapp ($(cut -c1-12 run/input/app/UPSTREAM_COMMIT))"
