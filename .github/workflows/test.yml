name: test

# Runs the Jest test suite on every pull request (and on pushes to main).
# Make this check "Required" in the branch protection rules of `main` so a PR
# can only be merged once the tests pass — see README / repo Settings > Branches.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json
            adapters/cap/package-lock.json
            adapters/node/package-lock.json
            adapters/express/package-lock.json
            adapters/web/package-lock.json
      - run: npm ci
      # lint gate — errors block the merge; warnings (pre-existing legacy debt
      # in the hand-ported classes) are reported but non-blocking.
      - run: npm run lint
      - run: npm ci
        working-directory: core
      # platform adapters — armed as smoke gates in the jest suite
      # (test/adapters.test.js skips them when not installed)
      - run: npm ci
        working-directory: adapters/cap
      - run: npm ci
        working-directory: adapters/node
      - run: npm ci
        working-directory: adapters/express
      - run: npm ci
        working-directory: adapters/web
      - run: npm test
      # A PR that touches a hand-port should say so against the upstream
      # revision it was reconciled with — --strict makes unreconciled drift
      # block here, where a human is already looking, while the nightly only
      # warns so an upstream sync is never blocked.
      - run: node scripts/check-port-drift.js --strict
      # Upstream announces retirements in docs/removal-plan.md and with
      # // OBSOLETE: markers; nothing used to carry that across to this port,
      # so a retired API could stay documented here indefinitely. A NEW
      # divergence fails; the known ones live in the baseline with a reason.
      - run: node scripts/check-upstream-divergence.js --strict
      # Upstream's src/99 is frozen legacy and is deliberately not carried
      # here; the mirror and the transpiler skip it, and this keeps them
      # skipping it (see the script header).
      - run: npm run check_frozen
