name: abap2UI5 transpile

# Transpile the framework classes from run/input/abap2UI5/src into run/output/abap2UI5
# (+ transpile report). Step 2 of the update_backend pipeline.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run transpile_abap2ui5
      - name: commit
        uses: ./.github/actions/commit-generated
        with:
          paths: run/output/abap2UI5
          message: "transpile: update run/output/abap2UI5 ($(cut -c1-12 run/input/abap2UI5/UPSTREAM_COMMIT))"
