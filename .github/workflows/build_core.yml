name: build core

# Rebuild the core package (src/ + the generated run/output trees) —
# assemble → publish → jest — and commit the refreshed core/.
# Step 3 of every update pipeline (backend / frontend / samples); replaces
# the monorepo-era "* to CAP" workflows: the CAP app itself is now built
# downstream in cap2UI5/builder-cap2UI5 — every update pipeline chains
# "trigger cap" after this step, which kicks that build when core/ changed.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json
            adapters/cap/package-lock.json
            adapters/node/package-lock.json
            adapters/express/package-lock.json
            adapters/web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: core
      # platform adapters — armed as smoke gates in the jest suite
      # (test/adapters.test.js skips them when not installed); the cap
      # adapter's node_modules also backs the assemble load-gate (@sap/cds)
      - run: npm ci
        working-directory: adapters/cap
      - run: npm ci
        working-directory: adapters/node
      - run: npm ci
        working-directory: adapters/express
      - run: npm ci
        working-directory: adapters/web
      - run: npm run build_core
      - run: npm run lint
      # self-healing ratchet: delists fixed known-failures (committed below),
      # still fails hard on regressions — an emitter improvement can no
      # longer freeze the nightlies behind a manual delist.
      # It also drops both gate reports in run/output/reports …
      - run: node scripts/ratchet-update.js
      # … which `npm test` reuses instead of regenerating them (the two heavy
      # gates would otherwise run the exact same scripts a second time in this
      # same job). See test/helpers/reports.js.
      - run: npm test
        env:
          Z2UI5_REPORTS_DIR: run/output/reports
      # Hand-ports shadow their upstream ABAP class, so an upstream change to
      # one of them is invisible to the transpiler. Report it (warning +
      # job summary) and record it in the baseline committed below, so each
      # divergence is announced exactly once instead of silently accumulating.
      # --record: drift lands in test/port-drift.pending.json and is committed
      # with the rest of the run, so it stays visible until someone reconciles
      # it. Report mode never touches the baseline that would silence it.
      - run: node scripts/check-port-drift.js --record
      - name: commit
        uses: ./.github/actions/commit-generated
        with:
          paths: core test/upstream-units.known-failures.json test/apps-smoke.known-failures.json test/port-drift.baseline.json
          message: "build: regenerate core"
