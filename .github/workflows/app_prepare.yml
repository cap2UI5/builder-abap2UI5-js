name: app prepare

# Build the ready-to-serve frontend from run/input/app/webapp into
# run/output/app (1:1 copy + the cap2UI5-specific patches applied by
# patch-frontend.js). Step 2 of the update_frontend pipeline; also runnable
# standalone.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prepare_app
      - name: commit
        uses: ./.github/actions/commit-generated
        with:
          paths: run/output/app
          message: "prepare: update run/output/app ($(cut -c1-12 run/input/app/UPSTREAM_COMMIT))"
