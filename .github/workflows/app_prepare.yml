name: app prepare

# Build the ready-to-serve frontend from run/input/app/webapp into
# run/output/app (1:1 copy + the cap2UI5-specific patches applied by
# patch-frontend.js). Step 2 of the update_frontend pipeline; also runnable
# standalone.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prepare_app
      # A `with:` input is never run through a shell — a $(…) in the commit
      # message would land in the history verbatim. Resolve it here instead.
      - name: read upstream sha
        id: upstream
        run: echo "short=$(cut -c1-12 run/input/app/UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: commit
        uses: ./.github/actions/commit-generated
        with:
          paths: run/output/app
          message: "prepare: update run/output/app (${{ steps.upstream.outputs.short }})"
